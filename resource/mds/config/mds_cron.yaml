################ mds计划任务 #######################
# 本配置仅用于创建mds集群时自动注册的计划任务时间
# 计划任务实际注册时间以数据库为准

mon: 
  script_name: mon.sh
  script_label: cmd
  specification: "30 6 * * 1-5"
bse: 
  script_name: bse.sh
  script_label: cmd
  specification: "2 8 * * 1-5"
sse: 
  script_name: sse.sh
  script_label: cmd
  specification: "5 8 * * 1-5"
szse: 
  script_name: szse.sh
  script_label: cmd
  specification: "36 7 * * 1-5"
backup: 
  script_name: backup.sh
  script_label: cmd
  specification: "0 20 * * 1-5"
