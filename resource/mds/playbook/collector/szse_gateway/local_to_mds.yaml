---

- name: send szse file to mds
  synchronize:
    src: "{{ local_path_mds_home_szse_colodir }}/"
    dest: "{{ slave_path_mds_home_data_exchange }}/"
    checksum: yes
  register: collector_szse_files_result
  ignore_errors: yes

- name: send szse etf file to mds
  synchronize:
    src: "{{ local_path_mds_home_szse_etf_colodir }}/"
    dest: "{{ slave_path_mds_home_data_exchange_szse_etf }}/"
  ignore_errors: yes

