---
- hosts: all

  vars_files:
    - ../common/base_vars.yaml

  tasks:
    - name: stop mds
      command: ./mds stop -F
      args:
        chdir: "{{ slave_path_mds_home_bin }}"
      ignore_errors: yes

    - name: mkdir mds home
      file:
        path: "{{ slave_backup_path }}"
        state: directory
        mode: 0755

    - name: unarchive mds package
      unarchive:
        src: "{{ slave_backup_path }}/{{ pkg_name }}.tar.gz"
        dest: "{{ slave_path_mds_home }}"
        remote_src: yes
