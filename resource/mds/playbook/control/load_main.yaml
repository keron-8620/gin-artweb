---
- hosts: all

  vars_files:
    - ../common/base_vars.yaml

  tasks:
    - name: check .ok file in salve
      wait_for:
        path: "{{ slave_path_mds_home_data_flags }}/{{ item }}"
        state: present
        timeout: 1
      with_items:
        - "{{ fetch_sse_ok }}"
        - "{{ fetch_szse_ok }}"
        - "{{ fetch_mon_ok }}"

    - name: mdster load data
      command: ./mds load -D -N
      args:
        chdir: "{{ slave_path_mds_home_bin }}"
      when: node_role == "master"
      ignore_errors: True

    - name: other load data
      command: ./mds load -D -N
      args:
        chdir: "{{ slave_path_mds_home_bin }}"
      when: node_role != "master"
      ignore_errors: True
