################ opt计划任务 #######################
# 本配置仅用于创建opt集群时自动注册的计划任务时间
# 计划任务实际注册时间以数据库为准
opt:  
  mon: "30 6 * * 1-5"
  counter_fetch: "30 7 * * 1-5"
  counter_distribute: "40 7 * * 1-5"
  sse: "5 8 * * 1-5"
  szse: "36 7 * * 1-5"
  backup: "0 20 * * 1-5"
