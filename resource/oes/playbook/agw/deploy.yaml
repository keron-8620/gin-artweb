---
- hosts: all

  vars_files:
    - ../common/agw_vars.yaml

  tasks:
    - name: create slave directory
      file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ slave_path_agw_home }}"
        - "{{ slave_path_agw_home_bin }}"
        - "{{ slave_path_agw_home_conf }}"
        - "{{ slave_path_agw_home_data }}"
        - "{{ slave_path_agw_home_logs }}"
        - "{{ slave_path_agw_home_sbin }}"

    - name: copy agw files to slave
      synchronize:
        src: "{{ local_path_agw_home_bin_id }}/"
        dest: "{{ slave_path_agw_home }}/"

    - name: copy common cfg file
      synchronize:
        src: "{{ local_path_agw_home_config_id }}/"
        dest: "{{ slave_path_agw_home_conf }}/"
