---
- hosts: all

  vars_files:
    - ../common/base_vars.yaml

  tasks:
    - name: stop oes
      command: ./oes stop -F
      args:
        chdir: "{{ slave_path_oes_home_bin }}"
      ignore_errors: yes

    - name: mkdir oes home
      file:
        path: "{{ slave_backup_path }}"
        state: directory
        mode: 0755

    - name: unarchive oes package
      unarchive:
        src: "{{ slave_backup_path }}/{{ pkg_name }}.tar.gz"
        dest: "{{ slave_path_oes_home }}"
        remote_src: yes
