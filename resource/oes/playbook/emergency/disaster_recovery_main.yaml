---
- hosts: all

  vars_files:
    - ../common/base_vars.yaml

  tasks:
    - name: load automatic variables
      include_vars: "{{ local_path_oes_home_config_all }}/automatic.yaml"
      delegate_to: 127.0.0.1
      run_once: true

    - name: mkdir local zb dirs
      file:
        path: "{{ local_path_oes_home_zb_colodir }}/{{ item }}"
        state: directory
        mode: '0755'
      with_items: "{{ zb_dir.split(',') | reject('equalto', '') | list }}"
      delegate_to: 127.0.0.1
      run_once: true

    - name: fetch remote oes_zb file
      command: "rsync -az -e 'ssh -p {{ zb_port }} -o BatchMode=yes' {{ zb_user }}@{{ zb_host }}:{{ zb_path }}/{{ item }}/ {{ local_path_oes_home_zb_colodir }}/{{ item }}/"
      with_items: "{{ zb_dir.split(',') | reject('equalto', '') | list }}"
      delegate_to: 127.0.0.1
      run_once: true

    - name: mkdir remote oes zb dirs
      file:
        path: "{{ slave_path_oes_home }}/{{ item }}"
        state: directory
        mode: '0755'
      with_items: "{{ zb_dir.split(',') | reject('equalto', '') | list }}"

    - name: send zb file to oes
      synchronize:
        src: "{{ local_path_oes_home_zb_colodir }}/{{ item }}/"
        dest: "{{ slave_path_oes_home }}/{{ item }}/"
        checksum: yes
      with_items: "{{ zb_dir.split(',') | reject('equalto', '') | list }}"