---
- hosts: all

  vars_files:
    - ../common/base_vars.yaml

  tasks:
    - name: stk touch flags
      file:
        path: "{{ slave_path_oes_home_data_flags }}/{{ item }}"
        state: touch
      with_items:
        - "{{ fetch_bse_ok }}"
        - "{{ fetch_sse_ok }}"
        - "{{ fetch_szse_ok }}"
        - "{{ fetch_mon_ok }}"
        - "{{ fetch_csdc_ok }}"
        - "{{ fetch_counter_ok }}"
      when: system_type == 'STK'

    - name: crd touch flags
      file:
        path: "{{ slave_path_oes_home_data_flags }}/{{ item }}"
        state: touch
      with_items:
        - "{{ fetch_sse_ok }}"
        - "{{ fetch_szse_ok }}"
        - "{{ fetch_mon_ok }}"
        - "{{ fetch_csdc_ok }}"
        - "{{ fetch_counter_ok }}"
        - "{{ fetch_sse_late_ok }}"
        - "{{ fetch_szse_late_ok }}"
      when: system_type == 'CRD'

    - name: opt touch flags
      file:
        path: "{{ slave_path_oes_home_data_flags }}/{{ item }}"
        state: touch
      with_items:
        - "{{ fetch_sse_ok }}"
        - "{{ fetch_szse_ok }}"
        - "{{ fetch_mon_ok }}"
        - "{{ fetch_csdc_ok }}"
        - "{{ fetch_counter_ok }}"
      when: system_type == 'OPT'

