server: # 服务配置
  host: "192.168.10.12" # 服务地址
  port: 8621 # 服务端口
  ssl: # ssl配置
    enable: false # 是否启用ssl
    key_path: "server.key" # ssl密钥文件
    crt_path: "server.crt" # ssl证书文件
    password: "" # ssl密钥密码
  rate: # 访问频率控制
    rps: 10 # 令牌生成速率
    burst: 20 # 桶容量
  timeout:
    request: 60s # 请求超时时间
    shutdown: 30s # 关闭超时时间
  swagger: true # 是否启用swagger
  enable_metrics: false # 是否暴露Prometheus指标，生产环境建议仅在管理网络开启
  enable_pprof: false # 是否暴露pprof，生产环境默认关闭
  trusted_proxies: [] # 受信任反向代理CIDR；为空时不信任X-Forwarded-For

database: # 数据库配置
  type: "sqlite" # 数据库类型(mysql/postgresql/opengauss/sqlserver/sqlite)
  dsn: "artweb.db" # sqlite3数据库配置
  # dsn: "root:your-password@tcp(127.0.0.1:3306)/artweb?charset=utf8mb4&parseTime=True&loc=Local" # MySql/OceanBase配置
  # dsn: "host=127.0.0.1 port=5432 user=gaussdb password=your-password dbname=artweb sslmode=disable" # PostgreSql/OpenGauss配置
  # dsn: "sqlserver://sa:your-password@127.0.0.1:1433?database=artweb&encrypt=disable&charset=utf8" # SqlServer配置

  max_idle_conns: 10 # 最大空闲连接数
  max_open_conns: 10 # 最大打开连接数
  log_sql: true # 是否记录sql日志
  conn_max_lifetime: 3600s # 连接最大存活时间
  conn_max_idle_time: 600s # 连接最大空闲时间
  read_timeout: 1s # 读超时时间
  write_timeout: 1s # 写超时时间
  list_timeout: 3s # 批量查询超时
  read_slow: 20ms # 查询单条数据慢查询阈值
  write_slow: 50ms # 写入慢查询阈值
  list_slow: 80ms # 查询列表慢查询阈值

log: # 日志服务
  level: "INFO" # 日志级别
  max_size: 10 # 日志文件大小限制(MB)
  max_age: 7 # 日志文件保存天数
  max_backups: 5 # 日志文件备份数量
  compress: true # 是否压缩日志文件
  format: "json" # 日志格式

cors: # 跨域服务
  allow_origins: # 允许的源，生产环境应配置明确的前端域名
    - "http://127.0.0.1:8621"
  allow_credentials: true # 是否允许携带cookie
  allow_methods: # 允许的方法
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers: # 允许的请求头
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Timestamp"
    - "X-Nonce"

security: # 安全配置
  host_guard: # host请求头配置
    enable: false # 是否启用host请求头防护
    trusted_hosts: # 受信任的host列表
      - "127.0.0.1:8621"
      - "192.168.10.12:8621"
  timestamp: # 时间戳相关配置(用于拦截重放攻击)
    check_timestamp: false # 是否检查时间戳
    tolerance: 300s  # 时间容忍度，允许客户端时间与服务器时间的最大偏差
    future_tolerance: 300s # 未来时间容忍度，允许客户端时间超前的最大范围
  login: # 登录服务
    max_failed_attempts: 5 # 登录失败最大次数
    lock_duration: 30m # 登录失败锁定时间
  password: # 密码策略
    strength_level: 2 # 密码强度等级(0-4)
  token: # token相关配置
    access_duration: 3600s # token有效时间
    refresh_duration: 3h # token刷新时间
    access_method: "HS256" # token访问方法
    refresh_method: "HS256" # token刷新方法

api:
  total_timeout: 10s       # 接口层总超时（所有API请求的最大耗时）
  biz_create_timeout: 8s   # 创建API业务逻辑超时
  biz_update_timeout: 8s   # 更新API业务逻辑超时
  biz_query_timeout: 5s    # 查询API业务逻辑超时
  biz_delete_timeout: 5s   # 删除API业务逻辑超时

ssh: # ssh服务
  private: "id_rsa" # ssh私钥的文件名
  timeout: 5s # ssh连接超时时间
  use_known_hosts: false # 严格校验 ~/.ssh/known_hosts；未知主机直接拒绝

upload: # 文件上传
  max_script_size: 1 # 上传脚本大小限制(MB)
  max_pkg_size: 100 # 上传程序包大小限制(MB)
  max_conf_size: 1 # 上传配置大小限制(MB)
